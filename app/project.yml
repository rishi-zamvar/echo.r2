name: EchoR2
options:
  bundleIdPrefix: com.rishizamvar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "373D7DZ9NM"
targets:
  EchoR2:
    type: application
    platform: iOS
    sources:
      - path: EchoR2
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SwiftTerm
    info:
      path: EchoR2/Info.plist
      properties:
        CFBundleDisplayName: echo
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    entitlements:
      path: EchoR2/EchoR2.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.echor2
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  EchoR2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EchoR2Tests
      - EchoR2/Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.echor2.tests
  EchoR2AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EchoR2AppTests
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: EchoR2
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.echor2.apptests
  EchoR2UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EchoR2UITests
    dependencies:
      - target: EchoR2
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.echor2.uitests
schemes:
  EchoR2:
    build:
      targets:
        EchoR2: all
        EchoR2AppTests: [test]
        EchoR2UITests: [test]
    test:
      targets:
        - EchoR2AppTests
        - EchoR2UITests
  EchoR2Tests:
    build:
      targets:
        EchoR2Tests: all
    test:
      targets:
        - EchoR2Tests
